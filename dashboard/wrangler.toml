name = "qepilot-stack-dashboard"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

pages_build_output_dir = "./dist"

# Plain-text build-time vars (PUBLIC_* must be here, not as secrets)
#
# Auth is intentionally UNCONFIGURED for the first deploy. The values that
# used to sit here were the upstream author's live Clerk instance and GitHub
# OAuth app — domain-locked to their site and not ours to reuse. Both
# consumers degrade gracefully when these are empty:
#   ClerkIsland.tsx      -> renders nothing when the key is absent
#   SendToRepoModal.tsx  -> shows "GitHub OAuth is not configured"
#
# To enable auth later, create your own Clerk application and GitHub OAuth
# app, then put YOUR publishable key / client id here and set the matching
# CLERK_SECRET_KEY and GITHUB_CLIENT_SECRET as Cloudflare Pages secrets.
[vars]
PUBLIC_CLERK_PUBLISHABLE_KEY = ""
PUBLIC_COMPONENTS_JSON_URL = "/components.json"
PUBLIC_GITHUB_CLIENT_ID = ""

# Secrets are set via Cloudflare Dashboard or `wrangler secret put`:
# CLERK_SECRET_KEY
# SUPABASE_URL
# SUPABASE_SERVICE_ROLE_KEY
# NEON_DATABASE_URL
# DISCORD_APP_ID
# DISCORD_BOT_TOKEN
# DISCORD_PUBLIC_KEY
# DISCORD_WEBHOOK_URL_CHANGELOG
# GITHUB_CLIENT_SECRET
# (PUBLIC_GITHUB_CLIENT_ID moved to [vars] above)
#
# Cron jobs (claude-code-check, health-check) are handled by the separate
# cloudflare-workers/crons Worker, not by this Pages project.
